<!doctype html><html lang="de"><meta charset="utf-8"><title>Migration 0.7 → 0.7.1</title><h1>Isolierter Migrationstest</h1><p>Nur auf einem neuen lokalen Testport ausführen. Kein vorhandener Bestand wird überschrieben.</p><button id="seed">0.7-Testdaten anlegen</button><button id="verify">Datenerhalt prüfen</button><pre id="result"></pre><a href="../">Version 0.7.1 öffnen</a><script>
const weather={min:0.5,max:8.5,wind:1,rain:0,effort:1,duration:1,cold:1};const base={id:'legacy-base',name:'Ärmellose Basis',type:'base',min:-1.5,max:20.5,wind:false,rain:false,waterRepellent:false,length:'sleeveless',status:'available',archived:false,notes:'Alte Notiz',care:[{at:'2026-10-29T00:00:00.000Z',action:'Gewaschen'}]};
const old={schemaVersion:4,weather,items:[base,{...base,id:'legacy-thermal',name:'Alte Thermo-Angabe',type:'longjersey',length:'sleeveless'},{...base,id:'legacy-rr',name:'Archivierte RevolutionRace',type:'rr',length:'long',archived:true}],rides:[{id:'past',startedAt:'2026-10-29T00:00:00.000Z',endedAt:'2026-10-29T01:00:00.000Z',weather,items:[{id:'legacy-base',name:'Historischer Name',type:'base'}],feedback:'right',note:'Alte Fahrt'}],activeRide:null,plan:{mode:'recommended',selectedIds:[],manualInitialized:false}};
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});const log=s=>document.querySelector('#result').textContent=s;
document.querySelector('#seed').onclick=async()=>{try{const r=indexedDB.open('gravel-outfit',3);r.onupgradeneeded=()=>{r.result.createObjectStore('state');r.result.createObjectStore('migrationBackups');r.result.createObjectStore('settings',{keyPath:'id'});};const d=await req(r);if(await req(d.transaction('state').objectStore('state').get('current')))throw Error('Vorhandener Bestand – keine Daten überschrieben.');const t=d.transaction(['state','settings'],'readwrite');t.objectStore('state').put(old,'current');t.objectStore('settings').put({id:'legacy',value:'Unverändert'});await new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=no;});d.close();log('BEREIT: Format 4, Dezimalwerte, Pflege, Archiv, Fahrt und unpassende alte Länge.');}catch(e){log(e.message);}};
document.querySelector('#verify').onclick=async()=>{try{const d=await req(indexedDB.open('gravel-outfit'));if(d.version!==4)throw Error('Datenbankversion nicht 4');const t=d.transaction(['state','migrationBackups','settings']);const [s,b,l]=await Promise.all([req(t.objectStore('state').get('current')),req(t.objectStore('migrationBackups').get('before-0.7.1')),req(t.objectStore('settings').get('legacy'))]);if(JSON.stringify(b)!==JSON.stringify(old))throw Error('Migrationskopie verändert');if(s.schemaVersion!==5)throw Error('Datenformat nicht 5');if(JSON.stringify(s.weather)!==JSON.stringify(old.weather)||JSON.stringify(s.rides)!==JSON.stringify(old.rides))throw Error('Wetter oder Fahrt verändert');for(const i of old.items)for(const [k,v] of Object.entries(i))if(JSON.stringify(s.items.find(x=>x.id===i.id)[k])!==JSON.stringify(v))throw Error('Altes Feld verändert: '+k);if(l.value!=='Unverändert')throw Error('Alter Store verändert');d.close();log('BESTANDEN: Dezimalwerte, alle Kleidungsfelder, Archiv, Pflege, Fahrten und alter Store exakt erhalten. Unveränderte Migrationskopie vorhanden.');}catch(e){log('FEHLER: '+e.message);}};
</script></html>
