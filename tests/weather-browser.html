<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wetter-Test</title><script src="../excel-rules.js"></script><script src="../weather.js"></script><script src="../core.js"></script><h1>Wetter-Test Berlin</h1><p>Öffentliche Testkoordinaten. Kein Zugriff auf den Gerätestandort.</p><button id="now">Berlin jetzt, 90 Minuten</button><button id="plan">Berlin morgen, 120 Minuten</button><button id="save" disabled>Testbestand herunterladen</button><pre id="result"></pre><script>let f;async function run(mode){document.querySelector('#result').textContent='Abruf läuft';try{f=await GravelWeather.request({geo:{getCurrentPosition(ok){ok({coords:{latitude:52.52,longitude:13.405}})}},mode,startLocal:GravelWeather.localInput(Date.now()+86400000),minutes:mode==='now'?90:120,signal:AbortSignal.timeout(25000)});document.querySelector('#result').textContent=JSON.stringify(f,null,2);document.querySelector('#save').disabled=false}catch(e){document.querySelector('#result').textContent=e.message}}document.querySelector('#now').onclick=()=>run('now');document.querySelector('#plan').onclick=()=>run('planned');document.querySelector('#save').onclick=()=>{const s=Gravel.seed();Gravel.importExcelItems(s);s.weather=GravelWeather.apply(s.weather,f);s.weather.planning={mode:f.mode,startAt:f.startAt};Gravel.validate(s);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='Gravel-Wetter-Berlin-Test.json';a.click()};</script></html>
